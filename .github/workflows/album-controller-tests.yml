name: AlbumController Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  album-controller-tests:
    name: AlbumController unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WebApplication6.sln

      - name: Build
        run: dotnet build WebApplication6.sln --configuration Release --no-restore

      - name: Run AlbumController tests
        run: >
          dotnet test WebApplication6.Tests/WebApplication6.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~WebApplication6.Tests.Tests.Unit.Controllers.AlbumControllerTest"
          --logger "trx;LogFileName=album-controller-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-controller-test-results
          path: TestResults