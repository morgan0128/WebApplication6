<main class="app-user-art">
  <section class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">ASP.NET MVC + Angular + PostgreSQL</p>

      </div>

    </header>

    <form (ngSubmit)="uploadImage()">
      <input
        type="file"
        accept="image/png,image/jpeg,image/webp"
        (change)="onFileSelected($event)"
      />

      @if (previewImageUrl){
        <img [src]="previewImageUrl" alt="Selected image preview" width="240" />
      }

      @if (imageUploadError){
        <p>{{ imageUploadError }}</p>
      }

      <button type="submit" [disabled]="!selectedFile || imageIsUploading">
        {{ imageIsUploading ? 'Uploading...' : 'Upload' }}
      </button>
    </form>

      @if (imagesIsLoading()){
        <p class="empty-state">Loading images...</p>
      } @else if (urls.length === 0){
        <p class="empty-state">No images yet.</p>
      } @else {
<!--        <ul aria-label="Uploaded images">-->
<!--          @for (image of images(); track image.id){-->
<!--              <li class="image-row">-->
<!--                <img [src]="image.storagePath" alt="Uploaded image" width="240" />-->
<!--&lt;!&ndash;                <button type="button" class="text-button" (click)="deleteImage(image)">&ndash;&gt;-->
<!--                  Delete-->
<!--                </button>-->
<!--              </li>-->
<!--          }-->
<!--        </ul>-->
        <div class="image-grid">
        @for (url of urls; track url){
          <img [src]="url" width="240"  alt=""/>
        }
        </div>
      }


  </section>
</main>
